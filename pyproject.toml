[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxai"
version = "0.1.0"
description = "LinuxAI - chatbot terminal untuk pengguna Windows yang baru pindah ke Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Ghana Rizqi Pratama" }]
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
linuxai = "linuxai.cli:main"

[tool.setuptools.packages.find]
include = ["linuxai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/Gna68/LINUX-AI"
Repository = "https://github.com/Gna68/LINUX-AI"
Issues = "https://github.com/Gna68/LINUX-AI/issues"
